version: 0.2
env:
  variables:
    BUCKET: shop-user-api-artifacts        # 필요시 변경
    KEY_CUR: releases/user-api-current.jar # 필요시 변경
    TARGET_TAG_KEY: app
    TARGET_TAG_VAL: user-api
    SERVICE_NAME: user-api
    PORT: "8080"
    AWS_REGION: ap-northeast-2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - 'echo "Region: ${AWS_REGION}"'

  build:
    commands:
      - |
        TARGETS=$(aws ec2 describe-instances \
          --region "$AWS_REGION" \
          --filters "Name=tag:${TARGET_TAG_KEY},Values=${TARGET_TAG_VAL}" "Name=instance-state-name,Values=running" \
          --query "Reservations[].Instances[].InstanceId" --output text)
        
        [ -z "$TARGETS" ] && echo "no targets" && exit 1
        
        COMMAND_ID=$(aws ssm send-command \
          --region "$AWS_REGION" \
          --instance-ids $TARGETS \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy ${SERVICE_NAME}" \
          --parameters commands="[
            \"set -eux\",
            \"source /etc/os-release || true\",
            \"if [ \\\"${ID:-}\\\" = amzn ] && [ \\\"${VERSION_ID:-}\\\" = 2 ]; then sudo yum install -y java-17-amazon-corretto-headless; fi\",
            \"if [ \\\"${ID:-}\\\" = amzn ] && [ \\\"${VERSION_ID:-}\\\" = 2023 ]; then sudo dnf install -y java-17-amazon-corretto-headless; fi\",
            \"if [ \\\"${ID:-}\\\" = ubuntu ] || [[ \\\"${ID_LIKE:-}\\\" = *debian* ]]; then sudo apt-get update -y && sudo apt-get install -y openjdk-17-jre-headless; fi\",
        
            \"sudo mkdir -p ${DEPLOY_DIR}\",
            \"sudo aws s3 cp s3://${BUCKET}/${KEY_CUR} ${DEPLOY_DIR}/${SERVICE_NAME}.jar --region ${AWS_REGION}\",
            \"sudo bash -lc 'systemctl stop ${SERVICE_NAME} || true'\",
        
            \"sudo bash -lc 'cat >/etc/systemd/system/${SERVICE_NAME}.service <<EOF
        [ Unit ]
        Description=${SERVICE_NAME}
        After=network.target
        [Service]
        User=ec2-user
        WorkingDirectory=${DEPLOY_DIR}
        ExecStart=/usr/bin/java -Xms256m -Xmx512m -jar ${DEPLOY_DIR}/${SERVICE_NAME}.jar --server.port=${PORT}
        Restart=always
        RestartSec=5
        SuccessExitStatus=143
        [Install]
        WantedBy=multi-user.target
        EOF'\",
        
        \"sudo systemctl daemon-reload\",
        \"sudo systemctl enable ${SERVICE_NAME}\",
        \"sudo systemctl restart ${SERVICE_NAME}\",
        \"sleep 2\",
        \"curl -sf http://localhost:${PORT}/actuator/health || exit 2\"
        ]" \
        --query "Command.CommandId" --output text)
        
        echo "{\"command_id\":\"$COMMAND_ID\"}" > ssm-result.json

artifacts:
  files:
    - ssm-result.json
