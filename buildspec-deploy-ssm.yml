version: 0.2
env:
  variables:
    BUCKET: shop-user-api-artifacts        # 필요시 변경
    KEY_CUR: releases/user-api-current.jar # 필요시 변경
    TARGET_TAG_KEY: app
    TARGET_TAG_VAL: user-api
    SERVICE_NAME: user-api
    PORT: "8080"
    AWS_REGION: ap-northeast-2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - 'echo "Region: ${AWS_REGION}"'

  build:
    commands:
      - echo "== write remote script locally =="

      # 1) 원격에서 실행할 스크립트를 로컬로 생성
      - |
        cat > remote.sh <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        
        : "${SERVICE_NAME:?SERVICE_NAME required}"
        : "${PORT:?PORT required}"
        : "${BUCKET:?BUCKET required}"
        : "${KEY_CUR:?KEY_CUR required}"
        
        APP_DIR="/opt/${SERVICE_NAME}"
        sudo mkdir -p "${APP_DIR}"
        sudo chown -R ec2-user:ec2-user "${APP_DIR}"
        
        # --- Parameter Store -> env values ---
        getp(){ aws ssm get-parameter --with-decryption --name "$1" --query 'Parameter.Value' --output text; }
        DB_URL="$(getp /nextshop/user/db/url)"
        DB_USER="$(getp /nextshop/user/db/username)"
        DB_PASS="$(getp /nextshop/user/db/password)"
        JWT_SECRET="$(getp /nextshop/user/jwt_secret || echo)"
        
        # --- .env (runtime values) ---
        cat > "${APP_DIR}/.env" <<EOF
        SPRING_PROFILES_ACTIVE=prod
        SERVER_PORT=${PORT}
        SPRING_DATASOURCE_URL=${DB_URL}
        SPRING_DATASOURCE_USERNAME=${DB_USER}
        SPRING_DATASOURCE_PASSWORD=${DB_PASS}
        JWT_SECRET=${JWT_SECRET}
        EOF
        sudo chown ec2-user:ec2-user "${APP_DIR}/.env"
        
        # --- 최신 JAR 가져오기 ---
        aws s3 cp "s3://${BUCKET}/${KEY_CUR}" "${APP_DIR}/${SERVICE_NAME}.jar"
        
        # --- systemd 유닛 ---
        sudo tee "/etc/systemd/system/${SERVICE_NAME}.service" >/dev/null <<EOF
        [Unit]
        Description=${SERVICE_NAME}
        After=network.target
        
        [Service]
        User=ec2-user
        WorkingDirectory=/opt/${SERVICE_NAME}
        EnvironmentFile=/opt/${SERVICE_NAME}/.env
        ExecStart=/usr/bin/java -Xms256m -Xmx512m -jar /opt/${SERVICE_NAME}/${SERVICE_NAME}.jar --server.port=${PORT}
        Restart=always
        RestartSec=5
        LimitNOFILE=65535
        
        [Install]
        WantedBy=multi-user.target
        EOF
        
        sudo systemctl daemon-reload
        sudo systemctl enable "${SERVICE_NAME}.service" || true
        sudo systemctl restart "${SERVICE_NAME}.service"
        
        # --- health check ---
        for i in {1..30}; do
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null && exit 0
          sleep 2
        done
        
        journalctl -u "${SERVICE_NAME}.service" -n 200 --no-pager || true
        exit 1
        SH
      - chmod +x remote.sh

      # 2) 스크립트를 base64로 인코딩 (GNU base64 없으면 tr로 줄바꿈 제거)
      - B64=$(base64 -w0 remote.sh 2>/dev/null || base64 remote.sh | tr -d '\n')

      # 3) SSM에 "베이스64 스크립트" 전달 → 인스턴스에서 디코드/실행
      - echo "== SSM send-command (base64 script) =="
      - |
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --comment "deploy ${SERVICE_NAME}" \
          --targets "Key=tag:${TARGET_TAG_KEY},Values=${TARGET_TAG_VAL}" \
          --parameters "commands=[
            \"echo ${B64} | base64 -d > /tmp/remote.sh\",
            \"chmod +x /tmp/remote.sh\",
            \"SERVICE_NAME=${SERVICE_NAME} PORT=${PORT} BUCKET=${BUCKET} KEY_CUR=${KEY_CUR} /tmp/remote.sh\"
          ]" \
          --timeout-seconds 600 \
          --max-concurrency "50%" \
          --max-errors "0%" \
          --region ${AWS_REGION} > ssm-result.json

artifacts:
  files:
    - ssm-result.json
