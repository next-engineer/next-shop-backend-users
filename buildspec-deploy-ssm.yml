version: 0.2
env:
  variables:
    # ====== 필요한 값만 너 환경으로 바꿔줘 ======
    BUCKET: shop-user-api-artifacts
    KEY_CUR: releases/user-api-current.jar
    TARGET_TAG_KEY: app
    TARGET_TAG_VAL: user-api
    SERVICE_NAME: user-api
    PORT: "8080"
    AWS_REGION: ap-northeast-2
phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Region: $AWS_REGION"
  build:
    commands:
      - echo "Deploy object => s3://$BUCKET/$KEY_CUR"
      - |
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --comment "deploy ${SERVICE_NAME}" \
          --targets "Key=tag:${TARGET_TAG_KEY},Values=${TARGET_TAG_VAL}" \
          --parameters '{
            "commands": [
              "set -euo pipefail",
              "APP_DIR=/opt/'"${SERVICE_NAME}"'",
              "PORT='"${PORT}"'",
              "sudo mkdir -p $APP_DIR && sudo chown -R ec2-user:ec2-user $APP_DIR",

              "# --- Parameter Store -> local vars ---",
              "getp() { aws ssm get-parameter --with-decryption --name \"$1\" --query '\''Parameter.Value'\'' --output text; }",
              "DB_URL=$(getp /nextshop/user/db/url)",
              "DB_USER=$(getp /nextshop/user/db/username)",
              "DB_PASS=$(getp /nextshop/user/db/password)",
              "JWT_SECRET=$(getp /nextshop/user/jwt_secret || echo)",

              "# --- write .env (실제 값 치환) ---",
              "bash -lc $'\''cat > $APP_DIR/.env <<\\\\EOF\\\\nSPRING_PROFILES_ACTIVE=prod\\\\nSERVER_PORT=${PORT}\\\\nSPRING_DATASOURCE_URL=${DB_URL}\\\\nSPRING_DATASOURCE_USERNAME=${DB_USER}\\\\nSPRING_DATASOURCE_PASSWORD=${DB_PASS}\\\\nJWT_SECRET=${JWT_SECRET}\\\\nEOF'\''",
              "chown ec2-user:ec2-user $APP_DIR/.env",

              "# --- download jar ---",
              "aws s3 cp s3://'"${BUCKET}"'/'"${KEY_CUR}"' $APP_DIR/'"${SERVICE_NAME}"'.jar",

              "# --- systemd unit (ANSI-C quoting로 안전하게) ---",
              "sudo bash -lc $'\''cat > /etc/systemd/system/'"${SERVICE_NAME}"'.service <<\\\\UNIT\\\\n[Unit]\\\\nDescription='\""${SERVICE_NAME}"\"'\\\\nAfter=network.target\\\\n\\\\n[Service]\\\\nUser=ec2-user\\\\nWorkingDirectory=/opt/'"${SERVICE_NAME}"'\\\\nEnvironmentFile=/opt/'"${SERVICE_NAME}"'/.env\\\\nExecStart=/usr/bin/java -Xms256m -Xmx512m -jar /opt/'"${SERVICE_NAME}"'/'"${SERVICE_NAME}"'.jar --server.port=${PORT}\\\\nRestart=always\\\\nRestartSec=5\\\\nLimitNOFILE=65535\\\\n\\\\n[Install]\\\\nWantedBy=multi-user.target\\\\nUNIT'\''",

              "sudo systemctl daemon-reload",
              "sudo systemctl enable '"${SERVICE_NAME}"'.service",
              "sudo systemctl restart '"${SERVICE_NAME}"'.service",

              "# --- health check ---",
              "for i in {1..30}; do curl -fsS http://127.0.0.1:${PORT}/health >/dev/null && exit 0; sleep 2; done",
              "journalctl -u '"${SERVICE_NAME}"'.service -n 200 --no-pager || true",
              "exit 1"
            ]
          }' \
          --timeout-seconds 600 \
          --max-concurrency "50%" \
          --max-errors "0%" \
          --region ${AWS_REGION} \
          > ssm-result.json
artifacts:
  files:
    - ssm-result.json
